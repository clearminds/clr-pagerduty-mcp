[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pagerduty-mcp-server"
version = "1.0.0"
description = "MCP server for PagerDuty incident management"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "clearminds"}]
keywords = ["mcp", "pagerduty", "incident", "oncall", "monitoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "httpx>=0.28.1",
    "fastmcp>=2.14.0,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/clearminds/pagerduty-mcp-server"

[project.scripts]
pagerduty-mcp-server = "pagerduty_mcp_server.server:main"
